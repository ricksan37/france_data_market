# .github/workflows/ci.yml
#
# Pipeline validation on every push.
#
# WHY NOT A SLIM CI. The spec (§13, Phase 6) planned an incremental build
# `dbt build --select state:modified+ --defer`. Measured 2026-09-04: the FULL
# build takes 1.79 seconds -- 15 models, 39 tests, 2 unit tests. There's
# nothing to save. And `--defer` assumes a persistent production environment
# to defer non-rebuilt models to, whereas warehouse.duckdb is ephemeral on a
# disposable runner. Slim CI's premise doesn't hold on this architecture: it
# optimizes a cost that doesn't exist, with a mechanism the infrastructure
# doesn't allow.
#
# WHAT WAS ACTUALLY MISSING was CI at all. The repo's only workflow triggered
# on Mondays or manually: a model that failed to compile would land on main
# and only be discovered at the next weekly run.
#
# NO SECRET IS NEEDED. The 2026-07-17 France Travail dump, the DINUM dump and
# the two snapshot CSVs are versioned: the entire graph rebuilds from the
# repo's data alone. This workflow therefore checks, on every commit, a claim
# the README has made since Phase 2 -- "no API key is required to reproduce
# the dbt layer" -- instead of leaving it to trust. A third party who clones
# the repo gets what CI gets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that follows another cancels the previous one: across a burst of
# close commits, only the latest state matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip  # installing dependencies dominates the job's duration,
                      # not the dbt build, which takes 2 seconds

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python scripts
        # dbt doesn't see the ingestion, enrichment and reporting scripts: a
        # syntax error in offer_presence.py would only surface the following
        # Monday, in the middle of the weekly run.
        run: python3 -m compileall -q *.py dashboard/*.py exploration/*.py

      - name: dbt build on versioned data
        working-directory: france_data_market
        env:
          CI_WITHOUT_EXTRACTION: "true"  # the LLM extraction dump isn't versioned
        run: dbt build

      - name: Generate the report
        # Validates the report's queries and its degradation path: without
        # LLM extraction, two sections must come out empty and not crash.
        run: python3 dashboard/generate_report.py
