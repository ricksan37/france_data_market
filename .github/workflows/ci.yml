# .github/workflows/ci.yml
#
# Pipeline validation on every push: without it, a model that fails to
# compile would only surface in the middle of the next Monday run.
#
# NO SLIM CI. An incremental `dbt build --select state:modified+ --defer`
# would save nothing: the FULL build takes under 3 seconds (99 nodes on
# 2026-10-02). And --defer needs a persistent production environment to
# defer to, whereas warehouse.duckdb is ephemeral on a disposable runner.
#
# NO SECRET IS NEEDED. A reference France Travail dump, the DINUM dumps and
# the two history CSVs are versioned: the whole graph rebuilds from the
# repo's data alone. Every commit thus checks the README's claim that no API
# key is required to reproduce the dbt layer: a third party who clones the
# repo gets what CI gets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that follows another cancels the previous one: across a burst of
# close commits, only the latest state matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, untested here.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip  # installing dependencies dominates the job's duration,
                      # not the dbt build, which takes 2 seconds

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python scripts
        # dbt doesn't see the ingestion, enrichment and reporting scripts: a
        # syntax error in offer_presence.py would only surface the following
        # Monday, in the middle of the weekly run.
        run: python3 -m compileall -q *.py dashboard/*.py exploration/*.py

      - name: dbt build on versioned data
        # dbt v2 rejects deprecated syntax at parse time (e.g. generic test
        # arguments outside `arguments:` is error dbt1159), so this build
        # also fails on any deprecated construct.
        working-directory: france_data_market
        env:
          CI_WITHOUT_EXTRACTION: "true"  # the LLM extraction dump isn't versioned
        run: dbt build

      - name: Generate the report
        # Validates the report's queries and its degradation path: without
        # LLM extraction, two sections must come out empty and not crash.
        run: python3 dashboard/generate_report.py

  # Public repository: every push scans the whole git history for secrets, not
  # only the new commit. The binary is pinned and checked against the checksum
  # published with the release: no third-party action, no Node runtime.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repo with its full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks scans every commit, not the working tree

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the history for secrets
        # --redact: a finding never prints the secret itself in the CI log.
        run: ./gitleaks detect --source . --redact --no-banner
