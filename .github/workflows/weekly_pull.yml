# .github/workflows/weekly_pull.yml
#
# Phase 5 (spec §13.1): ingest -> dbt build -> snapshot, automated.
#
# The GitHub Actions runner is disposable: nothing persists from one run to
# the next except what's explicitly committed. data/warehouse.duckdb and the
# JSON dumps therefore stay ephemeral (gitignored, as locally); only
# data/snapshots/marche_hebdo.csv is committed on every run, a lightweight
# file that accumulates the history fct_weekly_market needs without ever
# recommitting the 552+ raw offers (accepted decision, not reopened).

name: Weekly pull

on:
  schedule:
    # Monday 06:00 UTC. GitHub Actions cron: minute hour day month weekday.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}  # manual trigger from the Actions tab, to test without waiting for Monday

permissions:
  contents: write  # needed for the snapshot's git push at the end of the job

jobs:
  pull-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5  # v5 = Node 24. NOT v6: v6.0.0 persists
        # git credentials in a separate file, which the final git push depends on.

      - name: Setup Python 3.13
        uses: actions/setup-python@v6  # Node 24
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: France Travail ingestion
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python3 full_pull.py

      - name: Job offer presence history
        # Must run AFTER ingestion (it reads the freshly written dump) and
        # BEFORE dbt build (fct_weekly_market_flow consumes the CSV as a
        # source). Idempotent: the key is the (week, job_offer_id) pair, so a
        # manual re-trigger within the same week adds no row.
        run: python3 offer_presence.py

      - name: dbt build
        working-directory: france_data_market
        env:
          CI_WITHOUT_EXTRACTION: "true"
        run: dbt build

      - name: Compute the weekly snapshot
        run: python3 weekly_snapshot.py

      - name: Refresh the history mart
        # weekly_snapshot.py just appended the week to the CSV, which
        # stg_history__weekly_market reads as a source. Without this second
        # build, the report generated right after would show a series missing
        # the very week this run just measured -- a weekly report a week
        # behind itself. Restricted target: the rest of the graph hasn't
        # moved since the previous build.
        working-directory: france_data_market
        env:
          CI_WITHOUT_EXTRACTION: "true"
        run: dbt build --select stg_history__weekly_market+

      - name: Generate the HTML report (Phase 6a)
        # dashboard/report.html is gitignored (a regenerable artifact, like
        # warehouse.duckdb) -- never committed. Exported as a GitHub Actions
        # artifact to stay reviewable from the run's Actions tab, without
        # polluting the git history on every weekly run.
        run: python3 dashboard/generate_report.py
      - name: Upload the report as an artifact
        uses: actions/upload-artifact@v5  # Node 24
        with:
          name: france-data-market-report
          path: dashboard/report.html
          retention-days: 90

      - name: Commit and push the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/marche_hebdo.csv data/snapshots/presence_offres.csv
          git diff --staged --quiet && echo "Nothing to commit" || git commit -m "Automated weekly snapshot"
          git push
