name: 'france_data_market'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.11.0", "<1.12.0"]

profile: 'france_data_market'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


models:
  france_data_market:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table