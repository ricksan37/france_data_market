name: 'france_data_market'
version: '1.0.0'
config-version: 2
# dbt v2 does not enforce this on the root project (measured on 2.0.6): the
# exact version is pinned in requirements.txt. Kept as the declared range.
require-dbt-version: [">=2.0.0", "<3.0.0"]

profile: 'france_data_market'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


models:
  france_data_market:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table