version: 2

models:
  - name: int_employers_classified
    description: >
      Employer classification for each job offer, based on NAF code and
      employer name and, as a last resort, the end_client_masked text signal
      from the LLM extraction. Grain is 1 row = 1 job offer.
    columns:
      - name: job_offer_id
        description: Unique identifier of the job offer. Grain of this model.
        data_tests:
          - unique
          - not_null

      - name: employer_category
        description: >
          One of DIRECT_EMPLOYER (structurally identifiable employer),
          INTERMEDIARY (known staffing/recruitment firm, matched on NAF code
          or employer name), ANONYMOUS (no employer name and no intermediary
          NAF code), or INTERMEDIARY_RECLASSIFIED (structurally ANONYMOUS, but
          the offer's text reveals a masked end client -- see
          end_client_masked in stg_extraction__skills). Accepted values are
          checked by the singular test assert_employer_category_valid.

unit_tests:
  - name: test_employer_classification
    description: >
      Verifies the employer classification on NAF code, employer name
      (case-insensitive, no prefix match) and, as a last resort, the
      end_client_masked text signal; a structured employer name takes
      precedence over that text signal.
    model: int_employers_classified
    given:
      - input: ref('stg_raw__ft_job_offers')
        rows:
          - {job_offer_id: "1", employer_name_raw: "STEP UP", naf_code_on_offer: null}
          - {job_offer_id: "2", employer_name_raw: null, naf_code_on_offer: "62.02A"}
          - {job_offer_id: "3", employer_name_raw: "Crédit Agricole", naf_code_on_offer: null}
          - {job_offer_id: "4", employer_name_raw: null, naf_code_on_offer: null}
          - {job_offer_id: "5", employer_name_raw: null, naf_code_on_offer: "69.20Z"}
          - {job_offer_id: "6", employer_name_raw: null, naf_code_on_offer: null}
          - {job_offer_id: "7", employer_name_raw: "ALTECA", naf_code_on_offer: null}
          - {job_offer_id: "8", employer_name_raw: "CGI FINANCE", naf_code_on_offer: null}
          - {job_offer_id: "9", employer_name_raw: "Banque Exemple", naf_code_on_offer: null}
      - input: ref('stg_extraction__skills')
        rows:
          - {job_offer_id: "6", end_client_masked: true}
          - {job_offer_id: "9", end_client_masked: true}
    expect:
      rows:
        - {job_offer_id: "1", employer_category: "INTERMEDIARY"}
        - {job_offer_id: "2", employer_category: "INTERMEDIARY"}
        - {job_offer_id: "3", employer_category: "DIRECT_EMPLOYER"}
        - {job_offer_id: "4", employer_category: "ANONYMOUS"}
        - {job_offer_id: "5", employer_category: "ANONYMOUS"}
        - {job_offer_id: "6", employer_category: "INTERMEDIARY_RECLASSIFIED"}
        - {job_offer_id: "7", employer_category: "INTERMEDIARY"}
        - {job_offer_id: "8", employer_category: "DIRECT_EMPLOYER"}
        - {job_offer_id: "9", employer_category: "DIRECT_EMPLOYER"}
