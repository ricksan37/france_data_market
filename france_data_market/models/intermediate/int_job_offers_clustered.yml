version: 2

models:
  - name: int_job_offers_clustered
    description: >
      Groups job offers that are actually the same listing published several
      times (in several communes, or again in the same one), via a
      normalized-text signature (lowercase, collapsed whitespace -- not a
      similarity threshold). No offer is dropped: every analysis chooses to
      count offers or listings. Grain is 1 row = 1 job offer.
    columns:
      - name: job_offer_id
        description: Unique identifier of the job offer. Grain of this model.
        data_tests:
          - unique
          - not_null

      - name: listing_signature
        description: >
          MD5 hash of the offer's normalized description (lowercase,
          collapsed whitespace). Identical across every job offer that is
          actually the same listing.

      - name: cluster_size
        description: Number of job offers sharing this listing_signature.

      - name: is_canonical_listing
        description: >
          True for the oldest job offer in the cluster (the original
          publication; the others are reposts), tie-broken by job_offer_id
          so the result doesn't depend on read order. Exactly one true per
          listing_signature -- enforced downstream by
          assert_one_canonical_per_cluster on fct_job_offer.

unit_tests:
  - name: test_listing_clusters
    description: >
      Case and whitespace variants of a text share a signature; the oldest
      offer of a cluster is canonical; on equal dates job_offer_id breaks the
      tie, compared as text ("1000" sorts before "200").
    model: int_job_offers_clustered
    given:
      - input: ref('stg_raw__ft_job_offers')
        rows:
          - {job_offer_id: "200", job_offer_creation_date: "2026-09-20 10:00:00", job_description: "Nous recherchons un data engineer."}
          - {job_offer_id: "1000", job_offer_creation_date: "2026-09-20 10:00:00", job_description: "  NOUS  recherchons un   data engineer.  "}
          - {job_offer_id: "500", job_offer_creation_date: "2026-09-21 09:00:00", job_description: "Data analyst position."}
          - {job_offer_id: "400", job_offer_creation_date: "2026-09-22 09:00:00", job_description: "Data analyst position."}
          - {job_offer_id: "600", job_offer_creation_date: "2026-09-20 10:00:00", job_description: "Unique listing."}
    expect:
      rows:
        - {job_offer_id: "200", cluster_size: 2, is_canonical_listing: false}
        - {job_offer_id: "1000", cluster_size: 2, is_canonical_listing: true}
        - {job_offer_id: "500", cluster_size: 2, is_canonical_listing: true}
        - {job_offer_id: "400", cluster_size: 2, is_canonical_listing: false}
        - {job_offer_id: "600", cluster_size: 1, is_canonical_listing: true}