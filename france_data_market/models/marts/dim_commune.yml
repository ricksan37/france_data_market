version: 2

models:
  - name: dim_commune
    description: >
      Geographic reference table for the scope. Grain: one row per commune
      of the latest job offers dump, keyed on its INSEE code. Names come from
      France Travail's own location label, so no commune is ever left
      unnamed.
    columns:
      - name: commune_key
        description: >
          INSEE code of the commune (5 characters, "2A"/"2B" for Corsica;
          an arrondissement of Paris, Lyon or Marseille has its own code,
          e.g. 75109, distinct from the overall commune 75056). Grain key.
        data_tests:
          - unique
          - not_null
      - name: commune_name
        description: >
          Commune name taken from location_label ("44 - CARQUEFOU" ->
          "CARQUEFOU"). When the same commune arrives in two spellings, the
          mixed-case one (with accents and hyphens) is kept. For an
          arrondissement of Paris, Lyon or Marseille, the city's name
          ("Paris"), so that grouping by name counts the city once.
        data_tests:
          - not_null
      - name: arrondissement_name
        description: >
          Full arrondissement label ("Paris 9e Arrondissement") when
          commune_key is an arrondissement's INSEE code; NULL otherwise.
