version: 2

models:
  - name: dim_commune
    description: >
      Geographic reference table for the scope. Grain: one row per
      geographic key, postal code when it exists, INSEE code otherwise.
    columns:
      - name: commune_key
        description: >
          Grain key. The unique test was missing until 2026-09-04, and its
          absence cost something: the dimension then carried two duplicate
          keys (49000 and 95000, two postal codes each covering two INSEE
          communes), 292 rows for 290 codes. The defect had appeared on its
          own when the corpus grew from 552 to 960 offers, without breaking
          anything visible. It's a classic trap: a distinct on several
          columns never deduplicates a single column -- it came back through
          the data rather than through the code.
        data_tests:
          - unique
          - not_null
      - name: commune_name
        description: >
          Name resolved via geo.api.gouv.fr (enrich_communes.py). NULL as
          long as a newly appeared key hasn't been resolved yet,
          'UNRESOLVED' when the API returns nothing (99999, France Travail's
          sentinel for an unspecified location). No row is ever lost in
          either case.
