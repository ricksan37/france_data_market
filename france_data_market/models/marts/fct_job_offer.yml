version: 2

models:

  - name: fct_job_offer
    description: >
      Fine-grained fact table. One row per job offer. Assembles
      stg_raw__ft_job_offers with the salary (int_job_offer_salary) and
      employer classification (int_employer_classification) enrichments.
      Exposed model: this is the table to query for analysis, not the
      staging/intermediate layers.
    columns:
      - name: job_offer_id
        description: Unique identifier of the job offer.
        data_tests:
          - not_null
          - unique

      - name: job_title
        description: Job title.
        data_tests:
          - not_null

      - name: job_offer_creation_date
        description: Date the offer was created.
        data_tests:
          - not_null

      - name: rome_code
        description: ROME occupation code.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_rome')
              field: rome_code

      - name: postal_code
        description: >
          Postal code of the commune, as provided by France Travail. Empty
          for Paris, Lyon and Marseille, which don't have a single one:
          their arrondissement isn't transmitted, only the overall commune's
          INSEE code is. Kept for audit; don't use it as a geographic key,
          use commune_key.

      - name: commune_key
        description: >
          Unified geographic key: postal code when it exists, INSEE code
          otherwise. Covers 89.5% of the corpus versus 79.6% for the postal
          code alone. This is the join key toward dim_commune.
        data_tests:
          - relationships:
              to: ref('dim_commune')
              field: commune_key

      - name: geographic_zone
        description: >
          mainland, overseas or unknown. A dimension, not a restriction
          of scope: overseas territories weigh 17 offers out of 960 and
          excluding them doesn't move any metric, but the zone stays
          filterable on demand. 'unknown' covers the 101 offers with no
          location information at all, and remains a value in its own right
          rather than a default attachment to mainland France.
        data_tests:
          - not_null

      - name: siren
        description: >
          SIREN of the employing company, from the DINUM enrichment. NULL
          for offers outside the DIRECT_EMPLOYER scope (339) and for the 42
          in-scope offers unresolved by matching (80.3% matching rate on the
          213 eligible offers).
        data_tests:
          - relationships:
              to: ref('dim_company')
              field: siren

      - name: employer_name
        description: >
          Employer name. Structured (France Travail) except for the 21
          offers with employer_category = 'INTERMEDIARY_RECLASSIFIED', where
          it comes from employer_name_text, LLM-extracted from the offer's
          text. NULL on 5/21 of those offers: the masking is detected
          without the intermediary's name being identifiable in the text --
          deliberately not forced.

      - name: employer_category
        description: >
          DIRECT_EMPLOYER / INTERMEDIARY / ANONYMOUS / INTERMEDIARY_RECLASSIFIED.
          See int_employer_classification for the full logic.

      - name: annual_salary_plausible
        description: >
          Does the annual amount fall within the plausibility bounds
          [10,000, 300,000 €]? NULL when the question doesn't
          apply: non-annual period, or no amount. Three states rather than
          two, because "not applicable" isn't "implausible". Any annual
          salary aggregation must filter on it: as of 2026-09-03, 15 offers
          out of 275 are flagged false, and they're enough to drop Tableau's
          median to 1,800 € instead of 37,000 €. Invisible on the overall
          aggregate, which is 45,000 € either way; destructive on a slice.
          Consistency guaranteed by assert_plausible_salary_flag (severity
          error), volume tracked by assert_annual_salary_bounds (warn).

      - name: listing_signature
        description: >
          Fingerprint of the listing's text, normalized to lowercase with
          collapsed whitespace. Two offers sharing it are the same listing
          published more than once. 152 offers out of 960 are in this case
          as of 2026-09-04.

      - name: cluster_size
        description: >
          Number of offers sharing this signature. 1 for a listing published
          only once. Maximum observed: 25, one employer publishing the same
          position in 24 communes.
        data_tests:
          - not_null

      - name: is_canonical_listing
        description: >
          True for exactly one offer per cluster, the oldest one. Filtering
          on it counts LISTINGS (865), not filtering counts OFFERS (960).
          The gap isn't cosmetic: SQL loses 16.7% of its mentions and the
          salary median goes from 45,000 to 43,000 €. Uniqueness guaranteed
          by assert_one_canonical_per_cluster (severity error).
        data_tests:
          - not_null

      - name: job_description
        description: >
          Full text of the listing, carried over from stg_raw__ft_job_offers.
          Added as the source for LLM extraction. Carried by fct_job_offer
          rather than read from stg_raw__ft_job_offers because fct_job_offer
          is materialized as a table: it can be queried from any directory,
          where a view only resolves its relative path from the dbt
          project's own root.
        data_tests:
          - not_null
