version: 2

models:
  - name: fct_job_offer_technology
    description: >
      Fine-grained fact table: 1 row = 1 (job offer, technology) pair, for the
      offers of fct_job_offer. This grain is what lets you count how many
      offers ask for Python: a simple group by technology, impossible on a
      LIST column. Offers with no technology at all (a quarter of the offers
      on the 2026-09-26 dump, mostly consulting listings) have no row here --
      not data loss, fct_job_offer remains the reference table for counting
      offers. Empty in CI, where the LLM extraction doesn't run.
    data_tests:
      - unique:
          column_name: "job_offer_id || '|' || technology"
    columns:
      - name: job_offer_id
        description: Identifier of the job offer this technology mention belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_job_offer')
                field: job_offer_id

      - name: technology
        description: >
          A technology mentioned in the offer, as extracted by the LLM.
          Spellings differing only by case are merged under the corpus's
          most frequent one ("Power Bi" -> "Power BI"); spacing variants
          ("PowerBI") are not. The raw spelling is in stg_extraction__skills.
        data_tests:
          - not_null
