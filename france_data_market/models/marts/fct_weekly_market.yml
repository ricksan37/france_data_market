version: 2

models:
  - name: fct_weekly_market
    description: >
      Weekly state of the offer corpus. Grain: one row per ISO week,
      identified by its Monday. Measures the accumulated corpus size, NOT
      the number of offers active on the market at that date (see the
      model's header comment).
    columns:
      - name: week_start_date
        description: Monday of the ISO week. Grain key.
        data_tests:
          - unique
          - not_null
      - name: total_offer_count
        description: Offers in fct_job_offer at run time, accumulated corpus.
        data_tests:
          - not_null
      - name: reclassified_intermediary_offer_count
        description: >
          Offers reclassified from ANONYMOUS to INTERMEDIARY via
          end_client_masked. NULL (not 0) on weeks produced in CI, where the
          LLM extraction didn't run: the measurement is unavailable, not zero.
      - name: llm_extraction_available
        description: >
          True if the run that produced this row had the LLM extraction
          fields available. Lets you tell an absent measurement apart from a
          zero measurement on any column that depends on it.
