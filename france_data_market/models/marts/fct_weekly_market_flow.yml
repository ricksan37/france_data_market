version: 2

models:
  - name: fct_weekly_market_flow
    description: >
      Weekly market flow: active, appeared and disappeared offers, measured
      at the offer's grain on the presence of each offer in each France
      Travail pull (offer_presence.csv). Grain: one recorded week. Check
      is_series_break before reading a week's exits or new offers: on the
      first week of a new method or scope (seeds/series_breaks.csv), they
      measure the change of pipeline. In particular, every week up to
      2026-09-21 was recorded from truncated pulls, where an offer that slid
      out of the first page counted as an exit while still online.
    columns:
      - name: week_start_date
        description: Monday of the week of the dump used for the measurement.
        data_tests:
          - unique
          - not_null
      - name: weeks_since_previous
        description: >
          Gap in weeks with the previously recorded week. Use it to
          normalize rates: a gap of 6 means exit_rate_pct covers six weeks,
          not one. NULL on the first week.
      - name: active_offer_count
        description: Distinct offers present in this week's pull.
        data_tests:
          - not_null
      - name: new_offer_count
        description: Offers seen for the first time this week.
      - name: exit_count
        description: >
          Offers present the previously recorded week and absent from this
          one. NULL on the first week: no comparison point.
      - name: reappearance_count
        description: >
          Offers present this week, absent from the previous one, but
          already seen earlier. Neither new nor survivors: without this
          term, the active count's reconciliation doesn't close. NULL on the
          first week.
      - name: renewal_rate_pct
        description: new_offer_count as a percentage of active_offer_count.
      - name: exit_rate_pct
        description: >
          exit_count as a percentage of the PREVIOUS week's
          active_offer_count -- an exit is measured against the population
          that could exit. NULL on the first week.
      - name: is_series_break
        description: >
          True on the first week measured with a new method or scope
          (listed with its reason in seeds/series_breaks.csv): that week's
          exits and new offers reflect the pipeline, not the market.
        data_tests:
          - not_null
