version: 2

sources:
  - name: raw
    meta:
      external_location: "read_json_auto('../data/raw/job_offers_*.json')"
    tables:
      - name: ft_job_offers

  - name: dinum
    meta:
      external_location: "read_json_auto('../data/raw/enrich_dinum_2026-08-01_1727.json')"
    tables:
      - name: companies

  # Output of weekly_snapshot.py, hence a SOURCE just like the JSON dumps --
  # not a seed. The project's two seeds (mapping_domaines, mapping_communes)
  # are lookup tables maintained by hand; this file is written by a script on
  # every run. The criterion is who authors the file, not its extension.
  - name: history
    meta:
      external_location: "read_csv_auto('../data/snapshots/weekly_market.csv')"
    tables:
      - name: weekly_market

  # Output of offer_presence.py. A separate source from `history`: in this
  # project, external_location lives on the source, so two files = two
  # sources.
  - name: presence
    meta:
      external_location: "read_csv_auto('../data/snapshots/offer_presence.csv')"
    tables:
      - name: job_offer_presence

  - name: extraction
    meta:
      external_location: "read_json_auto('../data/raw/extract_skills_*.json')"
    tables:
      - name: skills
