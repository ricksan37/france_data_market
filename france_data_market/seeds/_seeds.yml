version: 2

seeds:
  - name: mapping_communes
    description: >
      Commune names resolved from geo.api.gouv.fr (enrich_communes.py).
      Key: postal code when the source provides one, overall commune's
      INSEE code otherwise (Paris, Lyon, Marseille).
    config:
      # varchar FORCED, not left to inference. With every value numeric, dbt
      # was typing the column as INTEGER: 01200 became 1200, and the join
      # with stg_raw__ft_job_offers, where the code is text, only held
      # together through DuckDB's implicit conversion. It worked, but by
      # accident. A postal or INSEE code is an identifier, not a quantity:
      # you don't add it, you don't compare it on an order, and its leading
      # zero carries information.
      column_types:
        commune_key: varchar
    columns:
      - name: commune_key
        data_tests:
          - unique
          - not_null

  - name: mapping_domaines
    description: >
      Normalization mapping for LLM-extracted domain values (see
      fct_job_offer_domain). Covers the 12 most frequent clusters (>60
      cumulative occurrences each, measured 2026-08-02 on the 552 real
      offers), roughly ~20% of mentions -- coverage tracked over time by
      assert_domain_mapping_coverage rather than extended blindly. The
      long tail (1-10 occurrences per value) is deliberately not mapped: no
      rule built on a sample too thin to defend.
    columns:
      - name: variant
        description: >
          A raw domain value as it can appear in stg_extraction__skills.domains
          (case, language and acronym variants of the same concept). Matched
          verbatim against the LLM's raw output, so kept in whatever
          language/casing the source data actually uses.
        data_tests:
          - unique
          - not_null

      - name: canonical_domain
        description: >
          The canonical English label every variant of a cluster normalizes
          to (e.g. "Gouvernance des données" / "Data Governance" both
          normalize to "Data Governance"). Drives what appears in reports
          and dashboards.
        data_tests:
          - not_null
