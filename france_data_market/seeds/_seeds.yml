version: 2

seeds:
  - name: series_breaks
    description: >
      Weeks where a weekly series changes method or scope, maintained by
      hand: the change from the previous week reflects the pipeline, not
      the market. Joined by fct_weekly_market and fct_weekly_market_flow
      into is_series_break. Add a row whenever the collection scope or a
      counting method changes.
    config:
      column_types:
        week_start_date: date
    columns:
      - name: week_start_date
        description: Monday of the first week measured with the new method or scope.
        data_tests:
          - unique
          - not_null
      - name: reason
        description: What changed that week, and why the change from the previous week isn't comparable.
        data_tests:
          - not_null

  - name: mapping_domaines
    description: >
      Normalization mapping for LLM-extracted domain values (see
      fct_job_offer_domain). Covers 12 clusters chosen for having more than
      60 cumulative occurrences each; they cover 19.6% of mentions (1144 of
      5828 on the 2026-09-26 dump). assert_domain_mapping_coverage warns if
      coverage falls under 15%, the signal to rework the mapping rather than
      extend it blindly. The long tail (1-10 occurrences per value) is
      deliberately not mapped: no rule built on a sample too thin to defend.
    columns:
      - name: variant
        description: >
          A raw domain value as it can appear in stg_extraction__skills.domains
          (case, language and acronym variants of the same concept). Matched
          verbatim against the LLM's raw output, so kept in whatever
          language/casing the source data actually uses.
        data_tests:
          - unique
          - not_null

      - name: canonical_domain
        description: >
          The canonical English label every variant of a cluster normalizes
          to (e.g. "Gouvernance des données" / "Data Governance" both
          normalize to "Data Governance"). Drives what appears in reports
          and dashboards.
        data_tests:
          - not_null
