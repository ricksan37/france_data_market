version: 2

models:

  - name: fct_offre
    description: >
      Table de faits, grain fin. Une ligne par offre. Assemble stg_ft_offres
      avec les enrichissements salaire (int_offres_salaire) et classification
      employeur (int_classification_employeur). Modèle exposé — c'est la
      table à interroger pour l'analyse, pas les couches staging/intermediate.
    columns:
      - name: offre_id
        description: identifiant unique de l'offre
        data_tests:
          - not_null
          - unique

      - name: intitule
        description: intitulé du poste
        data_tests:
          - not_null

      - name: date_creation
        description: date de création de l'offre
        data_tests:
          - not_null

      - name: rome_code
        description: code ROME du poste
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_rome')
              field: rome_code
      
      - name: code_postal
        description: >
          Code postal de la commune, tel que fourni par France Travail. Vide
          pour Paris, Lyon et Marseille, qui n'en ont pas d'unique : leur
          arrondissement n'est pas transmis, seul le code INSEE de commune
          globale l'est. Conservé pour l'audit ; ne pas s'en servir comme clé
          géographique, utiliser cle_commune.

      - name: cle_commune
        description: >
          Clé géographique unifiée : le code postal quand il existe, le code
          INSEE sinon. Couvre 89,5 % du corpus contre 79,6 % pour le seul code
          postal. C'est la clé de jointure vers dim_commune.
        data_tests:
          - relationships:
              to: ref('dim_commune')
              field: cle_commune

      - name: zone_geographique
        description: >
          metropole, outre-mer ou inconnue. Dimension et non restriction de
          périmètre : l'outre-mer pèse 17 offres sur 960 et l'exclure ne
          déplace aucune métrique, mais la zone reste filtrable à la demande.
          'inconnue' couvre les 101 offres sans aucune information de lieu, et
          reste une valeur à part entière plutôt qu'un rattachement par défaut
          à la métropole.
        data_tests:
          - not_null

      - name: siren
        description: >
          SIREN de l'entreprise employeuse, issu de l'enrichissement DINUM.
          NULL pour les offres hors périmètre EMPLOYEUR_DIRECT (339) et pour
          les 42 offres du périmètre non résolues par le matching (80,3 % de
          taux de matching sur les 213 offres éligibles — voir Session 5).
        data_tests:
          - relationships:
              to: ref('dim_entreprise')
              field: siren

      - name: entreprise_nom
        description: >
          Nom de l'entreprise. Structuré (France Travail) sauf pour les 21
          offres categorie_employeur = 'INTERMEDIAIRE_reclasse' (Session 7),
          où il provient d'entreprise_nom_texte, extrait par LLM depuis le
          texte de l'offre (Phase 4). NULL sur 5/21 de ces offres : le
          masquage est détecté sans que le nom de l'intermédiaire soit
          identifiable dans le texte — volontairement non forcé.

      - name: categorie_employeur
        description: >
          EMPLOYEUR_DIRECT / INTERMEDIAIRE / ANONYME / INTERMEDIAIRE_reclasse
          (spec §6.1, Session 7 pour la 4e valeur). Voir
          int_classification_employeur pour la logique complète.

      - name: salaire_annuel_plausible
        description: >
          Le montant annuel tient-il dans les bornes de plausibilité
          [10 000, 300 000 €] (spec §12.1). NULL quand la question ne se pose
          pas : période non annuelle, ou aucun montant. Trois états et non
          deux, parce que « non applicable » n'est pas « implausible ».
          Toute agrégation salariale annuelle doit filtrer dessus : au
          03/09/2026, 15 offres sur 275 sont marquées fausses, et elles
          suffisent à faire tomber la médiane de Tableau à 1 800 € au lieu
          de 37 000 €. Invisible sur l'agrégat global, qui vaut 45 000 € dans
          les deux cas ; destructeur sur une tranche.
          Cohérence garantie par assert_flag_salaire_plausible (severity
          error), volumétrie suivie par assert_bornes_salaire_annuel (warn).

      - name: description
        description: >
          Texte intégral de l'annonce, repris de stg_ft_offres. Ajouté en S6
          comme source de l'extraction LLM (Phase 4). Porté par fct_offre
          plutôt que lu depuis stg_ft_offres parce que fct_offre est
          matérialisée en table : elle s'interroge depuis n'importe quel
          répertoire, là où une vue ne résout son chemin relatif que depuis
          observatoire/.
        data_tests:
          - not_null