version: 2

models:

  - name: fct_offre
    description: >
      Table de faits, grain fin. Une ligne par offre. Assemble stg_ft_offres
      avec les enrichissements salaire (int_offres_salaire) et classification
      employeur (int_classification_employeur). Modèle exposé — c'est la
      table à interroger pour l'analyse, pas les couches staging/intermediate.
    columns:
      - name: offre_id
        description: identifiant unique de l'offre
        data_tests:
          - not_null
          - unique

      - name: intitule
        description: intitulé du poste
        data_tests:
          - not_null

      - name: date_creation
        description: date de création de l'offre
        data_tests:
          - not_null

      - name: rome_code
        description: code ROME du poste
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_rome')
              field: rome_code
      
      - name: code_postal
        description: code postal de la commune de l'offre
        data_tests:
          - relationships:
              to: ref('dim_commune')
              field: code_postal

      - name: siren
        description: >
          SIREN de l'entreprise employeuse, issu de l'enrichissement DINUM.
          NULL pour les offres hors périmètre EMPLOYEUR_DIRECT (339) et pour
          les 42 offres du périmètre non résolues par le matching (80,3 % de
          taux de matching sur les 213 offres éligibles — voir Session 5).
        data_tests:
          - relationships:
              to: ref('dim_entreprise')
              field: siren

      - name: description
        description: >
          Texte intégral de l'annonce, repris de stg_ft_offres. Ajouté en S6
          comme source de l'extraction LLM (Phase 4). Porté par fct_offre
          plutôt que lu depuis stg_ft_offres parce que fct_offre est
          matérialisée en table : elle s'interroge depuis n'importe quel
          répertoire, là où une vue ne résout son chemin relatif que depuis
          observatoire/.
        data_tests:
          - not_null